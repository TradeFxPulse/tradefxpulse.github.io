<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f4f8ff">
<meta name="theme-color" content="#05070d" media="(prefers-color-scheme: dark)">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trading Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  /* ==========================================================
     DESIGN TOKENS
     Accent chain (--accent-raw / --azure-* / --sky-400 / --cyan-glow)
     and --font-body / --font-display are written at runtime by
     applyAppearance() in the script below — their NAMES must not
     change. Everything else here is free to redesign.
  ========================================================== */
  :root{
    --ink:#0B2545;
    --ink-soft:#52678C;
    --accent-raw:#1D5FE0;
    --azure-900:#0F3D91;
    --azure-700:#1D5FE0;
    --azure-600:#2B6EE8;
    --azure-500:#3B82F6;
    --azure-300:#93C5FD;
    --sky-400:#5FA8FA;
    --cyan-glow:#38D9F0;
    /* Derived accent shades are computed and set as literal hex colors
       by applyAppearance() in JS — not via CSS color-mix(), which
       silently breaks on browsers/webviews that don't support it. */
    --frost-100:#EEF5FF;
    --line:rgba(11,37,69,.10);
    --line-strong:rgba(11,37,69,.17);
    --dim:#AEC1E0;
    --green-600:#16A34A; --green-400:#22C55E; --green-tint:#E9FBF1; --green-text:#0F7A3D;
    --red-600:#DC2626; --red-400:#F87171; --red-tint:#FEECEE; --red-text:#C81E3A;
    --gold-500:#C6981F; --gold-700:#96721A;
    --font-display:'Space Grotesk', system-ui, sans-serif;
    --font-body:'Inter', system-ui, sans-serif;
    --font-mono:'JetBrains Mono', ui-monospace, 'SF Mono', monospace;
    --text-scale:1;

    --card-bg:#ffffff;
    --card-glass:rgba(255,255,255,.82);
    --header-glass:rgba(255,255,255,.78);
    --nav-glass:rgba(255,255,255,.88);
    --body-bg:
      radial-gradient(circle at 12% -8%, #dbe9ff, transparent 52%),
      radial-gradient(circle at 104% 18%, #eaf3ff, transparent 48%),
      #f4f8ff;

    --r-xs:10px; --r-sm:14px; --r-md:18px; --r-lg:22px; --r-xl:28px; --r-pill:999px;
    --ease:cubic-bezier(.22,.9,.3,1);
    --shadow-card:0 18px 40px -26px rgba(15,61,145,.30), 0 1px 0 rgba(255,255,255,.7) inset;
    --shadow-raised:0 22px 48px -22px rgba(15,61,145,.34);
    --shadow-hero:0 26px 60px -22px rgba(29,95,224,.34), 0 1px 0 rgba(255,255,255,.5) inset;
    --shadow-nav:0 18px 42px -16px rgba(15,61,145,.40);
  }

  body.theme-dark{
    --ink:#F3F6FB;
    --ink-soft:#94A1BD;
    --frost-100:rgba(255,255,255,.05);
    --line:rgba(255,255,255,.085);
    --line-strong:rgba(255,255,255,.15);
    --dim:#3F4B67;
    --green-600:#0E9F63; --green-400:#34D399; --green-tint:rgba(52,211,153,.14); --green-text:#4ADE80;
    --red-600:#DC2626; --red-400:#FB7185; --red-tint:rgba(248,113,113,.14); --red-text:#FF8FA3;
    --gold-500:#E7C15C; --gold-700:#B8942C;
    --card-bg:#0E1526;
    --card-glass:rgba(14,20,36,.74);
    --header-glass:rgba(6,9,17,.72);
    --nav-glass:rgba(9,13,23,.86);
    --body-bg:
      radial-gradient(circle, rgba(255,255,255,.028) 1px, transparent 1px),
      radial-gradient(ellipse 900px 480px at 10% -8%, rgba(29,95,224,.16), transparent 60%),
      radial-gradient(ellipse 760px 520px at 108% 14%, rgba(56,217,240,.10), transparent 55%),
      #05070d;
    background-size: 30px 30px, auto, auto, auto;
    --shadow-card:0 24px 54px -26px rgba(0,0,0,.65), 0 1px 0 rgba(255,255,255,.045) inset;
    --shadow-raised:0 26px 60px -20px rgba(0,0,0,.6);
    --shadow-hero:0 30px 70px -20px rgba(29,95,224,.40), 0 0 0 1px rgba(255,255,255,.06) inset;
    --shadow-nav:0 20px 50px -16px rgba(0,0,0,.55);
  }

  *,*::before,*::after{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none; }
  :root{ color-scheme: light; }
  body.theme-dark{ color-scheme: dark; }
  html{ margin:0; padding:0; height:100%; min-height:100%; background:#f4f8ff; }
  html:has(body.theme-dark){ background:#05070d; }
  body{
    margin:0; padding:0;
    height:100%; min-height:100vh; min-height:100dvh;
    background: var(--body-bg);
    font-family: var(--font-body);
    color: var(--ink);
    overscroll-behavior-y: none;
    transition:background-color .35s var(--ease), color .35s var(--ease);
    -webkit-font-smoothing:antialiased;
  }
  a{ color:inherit; text-decoration:none; }
  button, input, textarea, select{ font:inherit; color:inherit; }
  button{ background:none; border:none; padding:0; cursor:pointer; -webkit-appearance:none; appearance:none; }
  button:focus-visible, a:focus-visible, input:focus-visible{
    outline: 2.5px solid var(--cyan-glow); outline-offset:2px; border-radius:8px;
  }
  .hidden{ display:none !important; }
  html{ scrollbar-width:none; -ms-overflow-style:none; }
  *{ scrollbar-width:none; -ms-overflow-style:none; }
  *::-webkit-scrollbar{ width:0; height:0; display:none; }
  .tabular{ font-variant-numeric:tabular-nums; }

  @keyframes revealUp{ from{ opacity:0; transform:translateY(14px); } to{ opacity:1; transform:translateY(0); } }
  @keyframes softPulse{ 0%,100%{ opacity:.55; } 50%{ opacity:1; } }

  /* ============ APP FRAME ============ */
  #appFrame{ max-width:540px; margin:0 auto; min-height:100vh; position:relative; padding-bottom:100px; }

  /* ============ HEADER ============ */
  .header{
    position:sticky; top:0; z-index:40;
    display:flex; align-items:center; gap:12px;
    padding:16px 18px;
    background:var(--header-glass);
    backdrop-filter:blur(20px) saturate(160%); -webkit-backdrop-filter:blur(20px) saturate(160%);
    border-bottom:1px solid var(--line);
  }
  .header-logo{
    width:40px; height:40px; border-radius:13px; flex-shrink:0;
    background:linear-gradient(150deg,var(--azure-700),var(--cyan-glow));
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 8px 18px -6px rgba(29,95,224,.55), 0 0 0 1px rgba(255,255,255,.14) inset;
  }
  .header-logo svg{ width:21px; height:21px; color:#fff; }
  .header-title{ font-family:var(--font-display); font-weight:700; font-size:16.5px; line-height:1.15; letter-spacing:-.01em; }
  .header-sub{ font-size:11px; color:var(--ink-soft); font-weight:600; margin-top:1px; }
  .header-spacer{ flex:1; }

  /* Notification pull-tab */
  .notif-wrap{ position:relative; }
  .notif-tab{
    width:40px; height:40px; border-radius:13px;
    background:var(--card-bg); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    box-shadow:var(--shadow-card);
    animation: notifSwing 1.8s ease-in-out .5s 1;
    transform-origin: top center;
    transition:border-color .2s var(--ease), transform .15s var(--ease);
  }
  .notif-tab:active{ transform:scale(.92); }
  .notif-tab svg{ width:17px; height:17px; color:var(--azure-700); }
  .notif-dot{ position:absolute; top:-3px; right:-3px; width:10px; height:10px; border-radius:50%; background:var(--red-600); border:2px solid var(--card-bg); box-shadow:0 0 0 2px rgba(220,38,38,.2); }
  @keyframes notifSwing{
    0%{ transform:rotate(0deg); } 15%{ transform:rotate(-9deg); } 35%{ transform:rotate(7deg); }
    55%{ transform:rotate(-4deg); } 75%{ transform:rotate(2deg); } 100%{ transform:rotate(0deg); }
  }
  .notif-panel{
    position:absolute; top:calc(100% + 10px); right:0; width:284px;
    background:linear-gradient(175deg,var(--card-bg),var(--card-bg));
    border-radius:var(--r-lg); box-shadow:0 28px 50px -18px rgba(0,0,0,.42);
    padding:16px 16px 14px; z-index:50;
    transform-origin:top right;
    transform:scale(.94) translateY(-6px); opacity:0; pointer-events:none;
    transition:transform .28s var(--ease), opacity .2s ease;
    border:1px solid var(--gold-700); border-top:2.5px solid var(--gold-500);
  }
  .notif-panel.open{ transform:scale(1) translateY(0); opacity:1; pointer-events:auto; }
  .notif-title{ font-family:var(--font-display); font-weight:700; font-size:11.5px; color:var(--gold-500); text-transform:uppercase; letter-spacing:.08em; margin-bottom:9px; display:flex; align-items:center; gap:6px; }
  .notif-title::before{ content:''; width:6px; height:6px; border-radius:50%; background:var(--gold-500); box-shadow:0 0 8px var(--gold-500); }
  .notif-item{ font-size:12.5px; color:var(--ink-soft); line-height:1.55; padding:8px 0; border-bottom:1px dashed var(--line); }
  .notif-item:last-child{ border-bottom:none; }

  .avatar-btn{
    width:40px; height:40px; border-radius:13px; flex-shrink:0;
    background:linear-gradient(150deg,var(--azure-600),var(--azure-900));
    color:#fff; font-family:var(--font-display); font-weight:700; font-size:14px;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 8px 18px -6px rgba(15,61,145,.55), 0 0 0 1px rgba(255,255,255,.12) inset;
    transition:transform .15s var(--ease);
  }
  .avatar-btn:active{ transform:scale(.92); }

  /* ============ VIEWS ============ */
  .view{ padding:18px 16px 8px; }
  .view-title{ font-family:var(--font-display); font-weight:700; font-size:21px; letter-spacing:-.01em; margin:4px 2px 16px; }
  .section-label{
    font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
    color:var(--azure-500); margin:24px 3px 11px; display:flex; align-items:center; gap:8px;
  }
  .section-label:first-child{ margin-top:2px; }
  .section-label::after{ content:''; flex:1; height:1px; background:linear-gradient(90deg,var(--line),transparent); }

  /* Stat cards grid (Home) — first card is the hero metric */
  .stat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:11px; }
  .stat-card{
    background:var(--card-glass); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border:1px solid var(--line); border-radius:var(--r-lg); padding:15px 16px;
    box-shadow:var(--shadow-card);
    transition:transform .18s var(--ease), box-shadow .18s var(--ease), border-color .18s var(--ease);
    animation:revealUp .5s var(--ease) both;
  }
  .stat-grid .stat-card:nth-child(1){ animation-delay:.02s; }
  .stat-grid .stat-card:nth-child(2){ animation-delay:.05s; }
  .stat-grid .stat-card:nth-child(3){ animation-delay:.08s; }
  .stat-grid .stat-card:nth-child(4){ animation-delay:.11s; }
  .stat-grid .stat-card:nth-child(5){ animation-delay:.14s; }
  .stat-grid .stat-card:nth-child(6){ animation-delay:.17s; }
  .stat-grid .stat-card:nth-child(7){ animation-delay:.20s; }
  .stat-grid .stat-card:nth-child(8){ animation-delay:.23s; }
  .stat-card:active{ transform:scale(.97); }
  @media (hover:hover){ .stat-card:hover{ transform:translateY(-2px); border-color:var(--line-strong); box-shadow:var(--shadow-raised); } }
  .stat-card-top{ display:flex; align-items:center; gap:9px; margin-bottom:10px; }
  .stat-icon{ width:27px; height:27px; border-radius:9px; display:flex; align-items:center; justify-content:center; flex-shrink:0; box-shadow:0 4px 10px -3px rgba(0,0,0,.28); }
  .stat-icon svg{ width:14px; height:14px; color:#fff; }
  .stat-label{ font-size:10.5px; font-weight:700; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em; }
  .stat-value{ font-family:var(--font-mono); font-weight:600; font-size:18px; letter-spacing:-.01em; }
  .stat-value.positive{ color:var(--green-text); }
  .stat-value.negative{ color:var(--red-text); }
  .stat-sub{ font-size:10.5px; color:var(--ink-soft); margin-top:3px; }

  /* Hero treatment — the first stat card is always Total P&L */
  #homeStatsGrid .stat-card:first-child{
    grid-column:1 / -1;
    padding:20px 22px;
    background:linear-gradient(155deg,rgba(29,95,224,.14),rgba(56,217,240,.05)), var(--card-glass);
    border-color:rgba(56,217,240,.28);
    box-shadow:var(--shadow-hero);
    position:relative; overflow:hidden;
  }
  #homeStatsGrid .stat-card:first-child::after{
    content:''; position:absolute; top:-40%; right:-15%; width:220px; height:220px; border-radius:50%;
    background:radial-gradient(circle,rgba(56,217,240,.20),transparent 70%);
    animation:softPulse 5s ease-in-out infinite; pointer-events:none;
  }
  #homeStatsGrid .stat-card:first-child .stat-icon{ width:34px; height:34px; border-radius:11px; }
  #homeStatsGrid .stat-card:first-child .stat-icon svg{ width:17px; height:17px; }
  #homeStatsGrid .stat-card:first-child .stat-label{ font-size:11px; letter-spacing:.07em; }
  #homeStatsGrid .stat-card:first-child .stat-value{ font-size:34px; font-weight:700; }
  #homeStatsGrid .stat-card:first-child .stat-sub{ font-size:11.5px; margin-top:5px; }
  .hero-flex{ display:flex; align-items:center; justify-content:space-between; gap:16px; }
  .hero-ring-wrap{ position:relative; width:64px; height:64px; flex-shrink:0; }
  .hero-ring-wrap svg{ width:100%; height:100%; }
  .hero-ring-label{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; font-family:var(--font-mono); font-weight:700; font-size:15px; color:var(--ink); line-height:1; }
  .hero-ring-label span{ font-size:7px; font-weight:600; letter-spacing:.03em; text-transform:uppercase; opacity:.75; margin-top:2px; font-family:var(--font-body); }

  /* Win/Loss donut (Analysis) */
  .wl-donut-row{ display:flex; align-items:center; gap:18px; }
  .wl-donut-wrap{ position:relative; width:76px; height:76px; flex-shrink:0; }
  .wl-donut-wrap svg{ width:100%; height:100%; }
  .wl-donut-label{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; font-family:var(--font-mono); font-weight:700; font-size:16px; color:var(--ink); line-height:1; }
  .wl-donut-label span{ font-size:8px; font-weight:600; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.03em; margin-top:2px; font-family:var(--font-body); }
  .wl-donut-stats{ flex:1; display:flex; flex-direction:column; gap:9px; }
  .wl-stat{ display:flex; align-items:center; gap:8px; font-size:12.5px; font-weight:600; color:var(--ink-soft); }
  .wl-stat i{ width:9px; height:9px; border-radius:3px; display:inline-block; flex-shrink:0; }

  /* Monthly bar chart (Analysis) */
  .mbar-chart{ display:flex; align-items:flex-end; gap:7px; height:110px; margin-bottom:14px; padding-top:6px; }
  .mbar-col{ flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; height:100%; }
  .mbar-track{ flex:1; width:100%; max-width:22px; display:flex; align-items:flex-end; background:var(--frost-100); border-radius:6px; overflow:hidden; }
  .mbar-fill{ width:100%; border-radius:6px 6px 0 0; transition:height .6s var(--ease); }
  .mbar-fill.positive{ background:linear-gradient(180deg,var(--green-400),var(--green-600)); }
  .mbar-fill.negative{ background:linear-gradient(180deg,var(--red-400),var(--red-600)); }
  .mbar-label{ font-size:9px; font-weight:700; color:var(--dim); text-transform:uppercase; }

  /* Long vs Short bar */
  .ls-bar-track{ display:flex; height:14px; border-radius:8px; overflow:hidden; margin-bottom:10px; }
  .ls-bar-long{ background:linear-gradient(90deg,var(--azure-700),var(--azure-500)); }
  .ls-bar-short{ background:linear-gradient(90deg,#8B5CF6,#A78BFA); }
  .ls-legend{ display:flex; gap:16px; margin-bottom:4px; }
  .ls-legend-item{ display:flex; align-items:center; gap:6px; font-size:11.5px; font-weight:600; color:var(--ink-soft); }
  .ls-legend-item i{ width:9px; height:9px; border-radius:3px; display:inline-block; }

  /* Daily P&L bar chart with month nav */
  .dpnl-nav{ display:flex; align-items:center; justify-content:center; gap:14px; margin-bottom:12px; }
  .dpnl-navbtn{ width:28px; height:28px; border-radius:50%; background:var(--frost-100); display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:transform .14s var(--ease), opacity .14s ease; }
  .dpnl-navbtn svg{ width:13px; height:13px; color:var(--azure-700); }
  .dpnl-navbtn:active{ transform:scale(.88); }
  .dpnl-navbtn:disabled{ opacity:.35; pointer-events:none; }
  .dpnl-month{ font-family:var(--font-display); font-weight:700; font-size:13.5px; min-width:110px; text-align:center; }
  .dpnl-chart{ display:flex; align-items:flex-end; gap:3px; height:100px; overflow-x:auto; padding:4px 2px 8px; }
  .dpnl-col{ flex:0 0 auto; width:16px; display:flex; flex-direction:column; align-items:center; gap:4px; height:100%; }
  .dpnl-track{ flex:1; width:8px; display:flex; align-items:flex-end; background:var(--frost-100); border-radius:4px; overflow:hidden; }
  .dpnl-fill{ width:100%; border-radius:4px 4px 0 0; }
  .dpnl-fill.positive{ background:linear-gradient(180deg,var(--green-400),var(--green-600)); }
  .dpnl-fill.negative{ background:linear-gradient(180deg,var(--red-400),var(--red-600)); }
  .dpnl-fill.flat{ background:var(--dim); opacity:.35; }
  .dpnl-daynum{ font-size:7px; font-weight:700; color:var(--dim); }
  .dpnl-legend{ display:flex; justify-content:center; gap:16px; margin-top:6px; font-size:10.5px; color:var(--ink-soft); font-weight:600; }
  .dpnl-legend i{ width:8px; height:8px; border-radius:2px; display:inline-block; margin-right:5px; }

  /* Win rate by day — 7-bar chart with gridlines + tap-to-reveal tooltip */
  .wbar-plot{ position:relative; height:112px; margin:10px 4px 0; }
  .wbar-gridline{ position:absolute; left:0; right:0; height:1px; background:var(--line); }
  .wbar-gridline--top{ background:var(--line-strong,var(--line)); }
  .wbar-gridlabel{ position:absolute; left:0; bottom:2px; font-family:var(--font-mono); font-size:8px; font-weight:700; color:var(--dim); background:var(--card-bg); padding-right:4px; }
  .wbar-bars{ position:absolute; inset:0; display:flex; align-items:flex-end; gap:9px; padding:0 3px; }
  .wbar-col{ flex:1; height:100%; display:flex; align-items:flex-end; justify-content:center; position:relative; cursor:pointer; }
  .wbar-fill{ width:62%; border-radius:6px 6px 2px 2px; transition:height .5s var(--ease); min-height:2px; }
  .wbar-fill.positive{ background:linear-gradient(180deg,var(--green-400),var(--green-600)); }
  .wbar-fill.negative{ background:linear-gradient(180deg,var(--red-400),var(--red-600)); }
  .wbar-fill.flat{ background:var(--dim); opacity:.3; }
  .wbar-labels{ display:flex; gap:9px; padding:0 3px; margin-top:8px; }
  .wbar-labels span{ flex:1; text-align:center; font-size:9px; font-weight:700; color:var(--dim); text-transform:uppercase; }
  .wbar-tooltip{
    position:absolute; left:0; bottom:0; transform:translate(-50%,calc(-100% - 10px));
    background:var(--ink); color:var(--card-bg); font-family:var(--font-mono); font-weight:700; font-size:11px;
    padding:4px 9px; border-radius:8px; pointer-events:none; opacity:0; white-space:nowrap; z-index:10;
    transition:opacity .15s ease;
  }
  .wbar-tooltip::after{ content:''; position:absolute; top:100%; left:50%; transform:translateX(-50%); border:5px solid transparent; border-top-color:var(--ink); }
  .wbar-tooltip.show{ opacity:1; }

  /* Avg Win vs Avg Loss — semicircle, green left / red right */
  .awl-wrap{ display:flex; align-items:center; gap:16px; }
  .awl-svg{ width:120px; height:66px; flex-shrink:0; }
  .awl-values{ flex:1; display:flex; flex-direction:column; gap:10px; }
  .awl-val{ display:flex; align-items:center; justify-content:space-between; padding:9px 12px; border-radius:12px; }
  .awl-val--win{ background:var(--green-tint); }
  .awl-val--loss{ background:var(--red-tint); }
  .awl-val span{ font-size:11px; font-weight:700; color:var(--ink-soft); }
  .awl-val--win b{ font-family:var(--font-mono); font-weight:700; font-size:14px; color:var(--green-text); }
  .awl-val--loss b{ font-family:var(--font-mono); font-weight:700; font-size:14px; color:var(--red-text); }
  .awl-ratio-txt{ font-family:var(--font-mono); font-weight:700; font-size:9px; fill:var(--ink-soft); }

  /* Equity curve */
  .equity-card{ background:var(--card-bg); border:1px solid var(--line); border-radius:var(--r-xl); padding:18px; box-shadow:var(--shadow-card); }
  .equity-timeframes{ display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; margin-bottom:12px; }
  .tf-pill{ flex:0 0 auto; padding:7px 13px; border-radius:var(--r-pill); background:var(--frost-100); font-size:11.5px; font-weight:700; color:var(--ink-soft); transition:all .18s var(--ease); }
  .tf-pill.active{ background:linear-gradient(135deg,var(--azure-700),var(--sky-400)); color:#fff; box-shadow:0 6px 14px -5px rgba(29,95,224,.55); }
  .equity-empty{ text-align:center; padding:26px 10px; font-size:12.5px; color:var(--ink-soft); }
  .equity-summary{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px; }
  .equity-summary-value{ font-family:var(--font-mono); font-weight:600; font-size:20px; letter-spacing:-.01em; }
  .equity-summary-label{ font-size:11px; color:var(--ink-soft); }

  /* Recent activity */
  .activity-row{ display:flex; align-items:center; gap:11px; padding:11px 0; border-bottom:1px solid var(--line); }
  .activity-row:last-child{ border-bottom:none; }
  .activity-dot{ width:9px; height:9px; border-radius:50%; flex-shrink:0; box-shadow:0 0 0 3px currentColor; opacity:.9; }
  .activity-main{ flex:1; min-width:0; }
  .activity-symbol{ font-weight:700; font-size:13px; }
  .activity-meta{ font-size:10.5px; color:var(--ink-soft); margin-top:1px; }
  .activity-pnl{ font-family:var(--font-mono); font-weight:600; font-size:13px; text-align:right; flex-shrink:0; }
  .activity-pnl.positive{ color:var(--green-text); }
  .activity-pnl.negative{ color:var(--red-text); }

  .heatmap-card{ background:var(--card-bg); border:1px solid var(--line); border-radius:var(--r-xl); padding:18px; box-shadow:var(--shadow-card); }
  .heatmap-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:13px; }
  .heatmap-month{ font-family:var(--font-display); font-weight:700; font-size:14.5px; }
  .heatmap-link{ font-size:12px; font-weight:700; color:var(--azure-600); }
  .heatmap-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:5px; }
  .heatmap-dow{ font-size:9px; font-weight:700; color:var(--dim); text-align:center; text-transform:uppercase; }
  .heatmap-cell{ aspect-ratio:1; border-radius:8px; background:var(--frost-100); display:flex; align-items:center; justify-content:center; min-height:32px; transition:transform .12s var(--ease); }
  .heatmap-daynum{ font-family:var(--font-mono); font-size:10.5px; font-weight:600; color:var(--ink-soft); }
  .heatmap-cell.win .heatmap-daynum, .heatmap-cell.loss .heatmap-daynum{ color:#fff; }
  .heatmap-cell.win{ background:linear-gradient(150deg,var(--green-400),var(--green-600)); box-shadow:0 4px 10px -4px rgba(34,197,94,.55); }
  .heatmap-cell.loss{ background:linear-gradient(150deg,var(--red-400),var(--red-600)); box-shadow:0 4px 10px -4px rgba(220,38,38,.5); }
  .heatmap-cell.empty{ background:transparent; }
  .heatmap-legend{ display:flex; align-items:center; gap:14px; margin-top:13px; font-size:10.5px; color:var(--ink-soft); }
  .heatmap-legend span{ display:inline-flex; align-items:center; gap:5px; }
  .legend-dot{ width:9px; height:9px; border-radius:3px; display:inline-block; }

  /* Quick tools row */
  .quick-row{ display:flex; gap:10px; overflow-x:auto; padding:2px 2px 6px; }
  .quick-card{
    flex:0 0 auto; width:86px; background:var(--card-bg); border:1px solid var(--line); border-radius:var(--r-md);
    padding:13px 8px; text-align:center; box-shadow:var(--shadow-card);
    transition:transform .16s var(--ease), border-color .16s var(--ease);
    animation:revealUp .45s var(--ease) both;
  }
  .quick-row .quick-card:nth-child(1){ animation-delay:.02s; }
  .quick-row .quick-card:nth-child(2){ animation-delay:.06s; }
  .quick-row .quick-card:nth-child(3){ animation-delay:.10s; }
  .quick-row .quick-card:nth-child(4){ animation-delay:.14s; }
  .quick-row .quick-card:nth-child(5){ animation-delay:.18s; }
  .quick-card:active{ transform:scale(.93); }
  @media (hover:hover){ .quick-card:hover{ transform:translateY(-3px); border-color:var(--line-strong); } }
  .quick-icon{ width:36px; height:36px; border-radius:12px; margin:0 auto 8px; display:flex; align-items:center; justify-content:center; box-shadow:0 6px 14px -5px rgba(0,0,0,.3); }
  .quick-icon svg{ width:17px; height:17px; color:#fff; }
  .quick-label{ font-size:10.5px; font-weight:700; color:var(--ink); line-height:1.2; }

  /* Empty state */
  .empty-state{ text-align:center; padding:38px 18px; }
  .empty-state svg{ width:44px; height:44px; color:var(--dim); margin-bottom:14px; }
  .empty-title{ font-family:var(--font-display); font-weight:700; font-size:15px; margin-bottom:6px; }
  .empty-sub{ font-size:12.5px; color:var(--ink-soft); line-height:1.55; max-width:280px; margin:0 auto 18px; }
  .empty-cta{
    display:inline-block; padding:12px 24px; border-radius:var(--r-md);
    background:linear-gradient(135deg,var(--azure-700),var(--cyan-glow)); color:#fff;
    font-weight:700; font-size:13px; box-shadow:0 10px 22px -6px rgba(29,95,224,.55);
    transition:transform .15s var(--ease);
  }
  .empty-cta:active{ transform:scale(.96); }

  /* Tabbar (Journal / Analysis internal sub-tabs) */
  .tabbar{ display:flex; background:var(--frost-100); border:1px solid var(--line); border-radius:var(--r-md); padding:4px; gap:3px; margin-bottom:18px; }
  .tabbar .tab-btn{ flex:1; padding:10px 6px; border-radius:calc(var(--r-md) - 4px); font-size:12.5px; font-weight:700; color:var(--ink-soft); transition:all .18s var(--ease); }
  .tabbar .tab-btn.active{ background:linear-gradient(135deg,var(--azure-700),var(--sky-400)); color:#fff; box-shadow:0 6px 14px -4px rgba(29,95,224,.5); }

  /* Tools grid */
  .tools-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .tool-card{
    background:var(--card-bg); border:1px solid var(--line); border-radius:var(--r-lg); padding:17px 15px;
    box-shadow:var(--shadow-card); text-align:left;
    transition:transform .16s var(--ease), box-shadow .16s var(--ease), border-color .16s var(--ease);
  }
  .tool-card:active{ transform:scale(.96); }
  @media (hover:hover){ .tool-card:hover{ transform:translateY(-3px); border-color:var(--line-strong); box-shadow:var(--shadow-raised); } }
  .tool-icon{ width:40px; height:40px; border-radius:13px; display:flex; align-items:center; justify-content:center; margin-bottom:11px; box-shadow:0 6px 14px -5px rgba(0,0,0,.3); }
  .tool-icon svg{ width:19px; height:19px; color:#fff; }
  .tool-name{ font-weight:700; font-size:13.5px; line-height:1.25; margin-bottom:3px; }
  .tool-desc{ font-size:11px; color:var(--ink-soft); line-height:1.4; }

  /* Analysis list rows */
  .insight-card{ background:var(--card-bg); border:1px solid var(--line); border-radius:var(--r-lg); padding:15px 17px; margin-bottom:11px; box-shadow:var(--shadow-card); }
  .insight-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .insight-row + .insight-row{ margin-top:10px; padding-top:10px; border-top:1px solid var(--line); }
  .insight-label{ font-size:12.5px; font-weight:600; color:var(--ink-soft); }
  .insight-value{ font-family:var(--font-mono); font-weight:600; font-size:13px; text-align:right; }
  .insight-value.positive{ color:var(--green-text); }
  .insight-value.negative{ color:var(--red-text); }
  .bar-track{ height:8px; border-radius:5px; background:var(--frost-100); overflow:hidden; margin-top:9px; }
  .bar-fill{ height:100%; border-radius:5px; background:linear-gradient(90deg,var(--azure-600),var(--cyan-glow)); transition:width .5s var(--ease); }
  .bar-fill.warn{ background:linear-gradient(90deg,var(--red-600),var(--red-400)); }
  .progress-ring-label{ display:flex; align-items:baseline; gap:7px; }
  .progress-big{ font-family:var(--font-mono); font-weight:700; font-size:27px; }

  .setup-row{ display:flex; align-items:center; justify-content:space-between; padding:12px 0; border-bottom:1px solid var(--line); }
  .setup-row:last-child{ border-bottom:none; }
  .setup-name{ font-weight:700; font-size:13px; }
  .setup-meta{ font-size:10.5px; color:var(--ink-soft); margin-top:2px; }
  .setup-pnl{ font-family:var(--font-mono); font-weight:600; font-size:13.5px; }
  .setup-pnl.positive{ color:var(--green-text); }
  .setup-pnl.negative{ color:var(--red-text); }

  .session-timeline-wrap{ position:relative; margin-bottom:18px; padding-top:24px; }
  .session-timeline{ position:relative; height:38px; border-radius:var(--r-sm); overflow:hidden; background:var(--frost-100); border:1px solid var(--line); }
  .tl-seg{ position:absolute; top:0; bottom:0; display:flex; align-items:center; justify-content:center; font-size:10.5px; font-weight:700; color:#fff; }
  .tl-asian{ background:linear-gradient(150deg,#F2A93C,#C6811E); }
  .tl-london{ background:linear-gradient(150deg,var(--azure-500),var(--azure-800,var(--azure-900))); }
  .tl-newyork{ background:linear-gradient(150deg,#2FA69E,#1F7972); }
  .tl-asian-label{ position:absolute; top:0; bottom:0; display:flex; align-items:center; font-size:10.5px; font-weight:700; color:#fff; pointer-events:none; }
  .tl-now-line{ position:absolute; top:-6px; bottom:-6px; width:2px; background:var(--gold-500); box-shadow:0 0 8px var(--gold-500); }
  .tl-now-flag{ position:absolute; top:0; transform:translateX(-50%); background:var(--gold-500); color:#1a1404; font-size:9px; font-weight:800; padding:2px 7px; border-radius:6px; white-space:nowrap; letter-spacing:.04em; }
  .tl-hours{ display:flex; justify-content:space-between; font-size:9.5px; color:var(--dim); font-weight:700; margin-top:7px; font-family:var(--font-mono); }

  /* More view */
  .more-list{ background:var(--card-bg); border:1px solid var(--line); border-radius:var(--r-lg); overflow:hidden; box-shadow:var(--shadow-card); }
  .more-item{ display:flex; align-items:center; gap:13px; padding:15px 16px; width:100%; text-align:left; border-bottom:1px solid var(--line); transition:background .15s var(--ease); }
  .more-item:last-child{ border-bottom:none; }
  .more-item:active{ background:var(--frost-100); }
  .more-icon{ width:36px; height:36px; border-radius:12px; display:flex; align-items:center; justify-content:center; flex-shrink:0; box-shadow:0 6px 14px -5px rgba(0,0,0,.3); }
  .more-icon svg{ width:16px; height:16px; color:#fff; }
  .more-text{ flex:1; }
  .more-item-title{ font-weight:700; font-size:13.5px; }
  .more-item-sub{ font-size:11px; color:var(--ink-soft); margin-top:1px; }
  .more-chevron{ width:9px; height:9px; color:var(--dim); flex-shrink:0; }
  .app-version{ text-align:center; font-size:11px; color:var(--dim); margin:22px 0 4px; }

  /* Embedded-tool frame host (Journal / Trades) */
  .frame-host{ border-radius:var(--r-xl); overflow:hidden; border:1px solid var(--line); box-shadow:var(--shadow-card); background:var(--card-bg); height:82vh; }
  .frame-host iframe{ width:100%; height:100%; border:none; display:block; }

  /* Tool full-page (iframe host) */
  #toolView{ position:fixed; inset:0; z-index:60; background:var(--bg-0,#0B2545); display:flex; flex-direction:column; transform:translateX(100%); transition:transform .32s var(--ease); }
  #toolView.open{ transform:translateX(0); }
  .tool-bar{ display:flex; align-items:center; gap:10px; padding:12px 14px; background:var(--header-glass); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); border-bottom:1px solid var(--line); flex-shrink:0; }
  .tool-back{ width:36px; height:36px; border-radius:var(--r-sm); background:var(--frost-100); display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:transform .15s var(--ease); }
  .tool-back:active{ transform:scale(.9); }
  .tool-back svg{ width:15px; height:15px; color:var(--azure-700); }
  .tool-bar-title{ font-weight:700; font-size:14.5px; }

  /* PROFILE (account) — same slide-in overlay mechanics as #toolView, native content */
  #profileView{ position:fixed; inset:0; z-index:60; background:var(--bg-0,#0B2545); display:flex; flex-direction:column; transform:translateX(100%); transition:transform .32s var(--ease); }
  #profileView.open{ transform:translateX(0); }
  .profile-scroll{ flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:18px 16px 40px; background:var(--bg); }
  .profile-hero{ display:flex; flex-direction:column; align-items:center; text-align:center; padding:10px 0 26px; }
  .profile-avatar-lg{ width:72px; height:72px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:700; font-size:28px; color:#fff; background:linear-gradient(150deg,var(--azure-700),var(--cyan-glow)); box-shadow:var(--shadow-card); margin-bottom:12px; }
  .profile-name{ font-family:var(--font-display); font-weight:700; font-size:18px; }
  .profile-email{ font-size:12.5px; color:var(--ink-soft); margin-top:2px; }
  .profile-input{ width:100%; border:1px solid var(--line); border-radius:var(--r-sm); background:var(--bg); color:var(--ink); padding:12px 14px; font-size:14px; font-family:inherit; }
  .profile-input:focus{ outline:none; border-color:var(--azure-700); }
  .profile-save-btn{ width:100%; margin-top:10px; padding:13px; border-radius:var(--r-sm); background:linear-gradient(150deg,var(--azure-700),var(--cyan-glow)); color:#fff; font-weight:700; font-size:14px; transition:transform .15s var(--ease); }
  .profile-save-btn:active{ transform:scale(.98); }
  .profile-save-btn:disabled{ opacity:.55; }
  .profile-msg{ font-size:12px; color:var(--ink-soft); margin-top:8px; min-height:15px; }
  .profile-msg.is-ok{ color:var(--green-600,#1B8A4C); }
  .profile-msg.is-err{ color:var(--red-600,#C1402E); }
  #toolFrame{ flex:1; width:100%; border:none; background:var(--card-bg); }

  /* Bottom nav */
  .bottomnav-wrap{ position:fixed; left:0; right:0; bottom:16px; display:flex; justify-content:center; z-index:45; padding:0 14px; pointer-events:none; }
  .bottomnav{
    position:relative;
    pointer-events:auto; display:flex; align-items:center; gap:1px;
    background:var(--nav-glass); backdrop-filter:blur(22px) saturate(160%); -webkit-backdrop-filter:blur(22px) saturate(160%);
    border:1px solid var(--line-strong); border-radius:var(--r-pill); padding:6px;
    box-shadow:var(--shadow-nav);
    max-width:100%;
  }
  .nav-item{ display:flex; flex-direction:column; align-items:center; gap:2px; padding:8px 11px; border-radius:var(--r-pill); transition:all .2s var(--ease); }
  .nav-item svg{ width:19px; height:19px; color:var(--ink-soft); transition:all .2s var(--ease); }
  .nav-item span{ font-size:8.5px; font-weight:700; color:var(--ink-soft); letter-spacing:.01em; }
  .nav-item.active{ background:linear-gradient(135deg,var(--azure-700),var(--sky-400)); box-shadow:0 8px 18px -6px rgba(29,95,224,.55); }
  .nav-item.active svg{ color:#fff; transform:scale(1.1); }
  .nav-item.active span{ color:#fff; }
  .nav-item:active{ transform:scale(.92); }

  /* Border-trace: a bright line sweeps once around the newly active tab */
  .nav-trace-svg{ position:absolute; pointer-events:none; z-index:5; overflow:visible; }
  .nav-trace-svg rect{ fill:none; stroke:var(--cyan-glow); stroke-width:2.5; vector-effect:non-scaling-stroke; }
  @keyframes navTraceDraw{
    from{ stroke-dashoffset:var(--peri,100); opacity:1; }
    70%{ stroke-dashoffset:0; opacity:1; }
    100%{ stroke-dashoffset:0; opacity:0; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition-duration:.001ms !important; animation-duration:.001ms !important; }
  }
  @media (min-width:380px){ #homeStatsGrid .stat-card:first-child .stat-value{ font-size:36px; } }

  /* ============ DESKTOP / PC ============ */
  @media (min-width:900px){
    body{ padding:28px 0; }
    #appFrame{ max-width:1120px; padding-bottom:44px; border-radius:var(--r-xl); }
    .header{ border-radius:var(--r-xl) var(--r-xl) 0 0; }
    .stat-grid{ grid-template-columns:repeat(4,1fr); gap:14px; }
    #homeStatsGrid .stat-card:first-child{ grid-column:1 / 3; }
    .tools-grid{ grid-template-columns:repeat(3,1fr); gap:14px; }
    .quick-row{ overflow-x:visible; flex-wrap:wrap; }
    .quick-card{ width:112px; }
    .heatmap-grid{ max-width:520px; margin:0 auto; }
    .heatmap-grid + .heatmap-legend{ justify-content:center; }
    .view{ padding:22px 30px 8px; }
    .frame-host{ height:78vh; }
    .bottomnav-wrap{ position:sticky; bottom:0; padding:18px 0 6px; }
    #toolView{ position:fixed; }
    .tool-bar{ max-width:1120px; margin:0 auto; width:100%; }
  }
  #authFrame{ position:fixed; inset:0; z-index:500; background:#0a0d1a; }
  #authIframe{ width:100%; height:100%; border:none; display:block; }
</style>
</head>
<body>

<div id="authFrame" class="hidden">
  <iframe id="authIframe" title="Sign in"></iframe>
</div>

<div id="appFrame" class="hidden">

  <!-- HEADER -->
  <div class="header">
    <div class="header-logo">
      <svg viewBox="0 0 24 24" fill="none"><path d="M3 17l6-6 4 4 8-8" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M15 7h6v6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div>
      <div class="header-title">Trading Journal</div>
      <div class="header-sub" id="headerSub">Welcome back</div>
    </div>
    <div class="header-spacer"></div>
    <div class="notif-wrap">
      <button class="notif-tab" id="notifBtn" type="button" aria-label="Notifications">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 6h11M4 6l2-3h7l2 3M6 6v13M15 6v13M9 10.5h3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <span class="notif-dot" id="notifDot"></span>
      <div class="notif-panel" id="notifPanel">
        <div class="notif-title">Notes for you</div>
        <div id="notifItems"></div>
      </div>
    </div>
    <button class="avatar-btn" id="avatarBtn" type="button" aria-label="Open profile">T</button>
  </div>

  <!-- HOME -->
  <div class="view" id="view-home">
    <div class="stat-grid" id="homeStatsGrid"></div>

    <div class="section-label">Equity curve</div>
    <div class="equity-card">
      <div class="equity-timeframes" id="equityTimeframes">
        <button class="tf-pill" type="button" data-range="1">Today</button>
        <button class="tf-pill" type="button" data-range="7">7 Days</button>
        <button class="tf-pill active" type="button" data-range="30">30 Days</button>
        <button class="tf-pill" type="button" data-range="90">3 Months</button>
        <button class="tf-pill" type="button" data-range="365">1 Year</button>
        <button class="tf-pill" type="button" data-range="all">All</button>
      </div>
      <div id="equityChartWrap"></div>
    </div>

    <div class="section-label">Recent activity</div>
    <div class="insight-card" id="recentActivityCard"></div>

    <div class="section-label">This month</div>
    <div class="heatmap-card">
      <div class="heatmap-head">
        <span class="heatmap-month" id="heatmapMonthLabel">—</span>
        <button class="heatmap-link" type="button" data-nav="trades">Open calendar</button>
      </div>
      <div class="heatmap-grid" id="heatmapDow"></div>
      <div class="heatmap-grid" id="heatmapGrid" style="margin-top:5px;"></div>
      <div class="heatmap-legend">
        <span><i class="legend-dot" style="background:var(--green-400)"></i>Win day</span>
        <span><i class="legend-dot" style="background:var(--red-400)"></i>Loss day</span>
        <span><i class="legend-dot" style="background:var(--frost-100)"></i>No trades</span>
      </div>
    </div>

    <div class="section-label">Quick tools</div>
    <div class="quick-row" id="quickToolsRow"></div>
  </div>

  <!-- JOURNAL (trade calendar + daily planner, kept as two distinct destinations) -->
  <div class="view hidden" id="view-journal">
    <div class="frame-host">
      <iframe id="journalFrame"></iframe>
    </div>
  </div>

  <!-- TRADES -->
  <div class="view hidden" id="view-trades">
    <div class="frame-host">
      <iframe id="tradesFrame"></iframe>
    </div>
  </div>

  <!-- ANALYSIS -->
  <div class="view hidden" id="view-analysis">
    <div class="view-title">Analysis</div>
    <div class="tabbar" id="analysisSubTabs">
      <button class="tab-btn active" type="button" data-sub="overview">Analytics</button>
      <button class="tab-btn" type="button" data-sub="psychology">Psychology</button>
      <button class="tab-btn" type="button" data-sub="playbook">Playbook</button>
    </div>
    <div id="analysisContent"></div>
  </div>

  <!-- TOOLS -->
  <div class="view hidden" id="view-tools">
    <div class="view-title">Tools</div>
    <div class="tools-grid" id="toolsGrid"></div>
  </div>

  <!-- MORE -->
  <div class="view hidden" id="view-more">
    <div class="view-title">More</div>
    <div class="more-list" id="moreList"></div>
    <div class="app-version">Trading Journal · local data, no account needed</div>
  </div>

</div>

<!-- FULL-PAGE TOOL HOST -->
<div id="toolView">
  <div class="tool-bar">
    <button class="tool-back" id="toolBackBtn" type="button" aria-label="Back to Tools">
      <svg viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>

<script>
(function(){
  "use strict";

  // ---- Auth (Supabase) ----------------------------------------------------
  // Fill these in once you've created a Supabase project — see the setup guide.
  var AUTH_CONFIG = {
    SUPABASE_URL: 'https://svilgvmmffsbdkpcbhlc.supabase.co',
    SUPABASE_ANON_KEY: 'sb_publishable_tS99h3ia4cMMPkknSNU_ww_q2s-bthc'
  };
  var authReady = AUTH_CONFIG.SUPABASE_URL.indexOf('YOUR_SUPABASE_URL') === -1 && AUTH_CONFIG.SUPABASE_ANON_KEY.indexOf('YOUR_SUPABASE_ANON_KEY') === -1;
  var authClient = (authReady && window.supabase) ? window.supabase.createClient(AUTH_CONFIG.SUPABASE_URL, AUTH_CONFIG.SUPABASE_ANON_KEY) : null;
  var currentUser = null;
  var appStarted = false;
  var refreshView = null; // set once startApp() has run — see goToView() below

  var authFrameEl = document.getElementById('authFrame');
  var appFrameEl = document.getElementById('appFrame');
  var authIframeEl = document.getElementById('authIframe');

  // The login/signup screens are bundled the same way the in-app tools are
  // (base64 HTML decoded into an iframe's srcdoc) — see TJ_SRC_AUTH_LOGIN /
  // TJ_SRC_AUTH_SIGNUP above. Their own CONFIG placeholders are swapped for
  // the real values here, so there's exactly one place to paste your
  // Supabase keys instead of three.
  function decodeAuthSrc(raw){
    try{ return decodeURIComponent(escape(window.atob(raw))); }catch(e){ return atob(raw); }
  }
  function authHtml(which){
    var raw = which === 'signup' ? TJ_SRC_AUTH_SIGNUP : TJ_SRC_AUTH_LOGIN;
    // Replace only the CONFIG value assignments — not every occurrence of the
    // placeholder text — so the embedded screen's own "is this filled in?"
    // check (which also looks for the placeholder string) still works.
    return decodeAuthSrc(raw)
      .split("SUPABASE_URL: 'YOUR_SUPABASE_URL'").join("SUPABASE_URL: '" + AUTH_CONFIG.SUPABASE_URL + "'")
      .split("SUPABASE_ANON_KEY: 'YOUR_SUPABASE_ANON_KEY'").join("SUPABASE_ANON_KEY: '" + AUTH_CONFIG.SUPABASE_ANON_KEY + "'");
  }

  /* ============================================================
     PER-USER DATA SYNC
     Trades, journal entries, the planner, and the calculators that
     save setups all still read/write plain localStorage exactly as
     before (zero changes to any of those tools) — but every key any
     of them touch is mirrored to a private Supabase row for the
     signed-in user, and localStorage is re-hydrated from Supabase
     (not just left as-is) every time someone signs in. That's what
     actually stops two different accounts on the same browser from
     seeing each other's data: local storage becomes a per-session
     cache of "whoever is signed in right now," not a shared pool.
  ============================================================ */
  var KV_TABLE = 'tj_kv';
  function isSyncedKey(key){
    if(!key) return false;
    if(key.indexOf('tjstore::') === 0) return true; // journal, planner, compounding, settings-appearance
    if(key === 'tl_journal' || key === 'tl_setups') return true; // risk/reward tool's saved setups + notes
    if(key === 'fxpulse_settings_v1') return true; // sessions tool
    return false;
  }
  function clearSyncedLocalKeys(){
    var toRemove = [];
    for(var i=0;i<localStorage.length;i++){
      var k = localStorage.key(i);
      if(isSyncedKey(k)) toRemove.push(k);
    }
    toRemove.forEach(function(k){ try{ localStorage.removeItem(k); }catch(e){} });
  }
  function adoptExistingLocalData(userId){
    var rows = [];
    for(var i=0;i<localStorage.length;i++){
      var k = localStorage.key(i);
      if(isSyncedKey(k)) rows.push({ user_id:userId, store_key:k, value: localStorage.getItem(k), updated_at:new Date().toISOString() });
    }
    if(!rows.length) return Promise.resolve();
    return authClient.from(KV_TABLE).upsert(rows, { onConflict:'user_id,store_key' }).then(function(){});
  }
  function downloadFromCloud(userId){
    clearSyncedLocalKeys();
    return authClient.from(KV_TABLE).select('store_key,value').eq('user_id', userId).then(function(res){
      if(res && !res.error && res.data){
        res.data.forEach(function(row){ try{ localStorage.setItem(row.store_key, row.value); }catch(e){} });
      }
    });

  function hydrateCloudData(user){
    if(!authClient || !user) { clearSyncedLocalKeys(); return Promise.resolve(); }
    return authClient.from(KV_TABLE).select('*', { count:'exact', head:true }).eq('user_id', user.id).then(function(res){
      var hasCloudData = !!(res && res.count);
      if(!hasCloudData) return adoptExistingLocalData(user.id).then(function(){ return downloadFromCloud(user.id); });
      return downloadFromCloud(user.id);
    }).catch(function(){ /* offline or unreachable — proceed with whatever's local rather than block sign-in */ });
  }

  var cloudUpsertTimers = {};
  function scheduleCloudSync(key, newValue){
    clearTimeout(cloudUpsertTimers[key]);
    cloudUpsertTimers[key] = setTimeout(function(){
      if(!authClient || !currentUser) return;
      if(newValue === null){
        authClient.from(KV_TABLE).delete().eq('user_id', currentUser.id).eq('store_key', key).then(function(){});

          { user_id: currentUser.id, store_key: key, value: newValue, updated_at: new Date().toISOString() },

    scheduleCloudSync(e.key, e.newValue);
  });

  function resetLoadedToolFrames(){
    ['tradesFrame','journalFrame'].forEach(function(id){
      var fr = document.getElementById(id);
      if(fr){ fr.removeAttribute('data-loaded'); fr.srcdoc = 'about:blank'; }
    });
  }

  function showAuth(which){
    appFrameEl.classList.add('hidden');
    authIframeEl.srcdoc = authHtml(which || 'login');
    authFrameEl.classList.remove('hidden');
  }
  function enterApp(session){
    currentUser = session ? session.user : null;
    hydrateCloudData(currentUser).then(function(){
      authFrameEl.classList.add('hidden');
      authIframeEl.srcdoc = 'about:blank';
      appFrameEl.classList.remove('hidden');
      if(!appStarted){ appStarted = true; startApp(); }

    });
  }

  // Messages from the embedded login/signup screens.
  window.addEventListener('message', function(ev){

    if(!d || !d.type) return;

    } else if(d.type === 'tj-auth-google'){
      if(!authClient) return;
      authClient.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: window.location.href } });
    } else if(d.type === 'tj-auth-success'){
      if(!authClient){ enterApp(null); return; }
      authClient.auth.getSession().then(function(result){
        enterApp(result.data && result.data.session);
      });
    }
  });

  function signOut(){
    resetLoadedToolFrames();
    if(!authClient){ appStarted = false; clearSyncedLocalKeys(); showAuth('login'); return; }
    authClient.auth.signOut().then(function(){ appStarted = false; clearSyncedLocalKeys(); showAuth('login'); });
  }

  function startApp(){

  /* ============================================================
     STORAGE — same-origin shared localStorage under the tjstore::
     prefix. Every embedded tool (via srcdoc iframe) writes into the
     exact same store, so the shell can read real trade / planner
     data straight out of it with zero backend and zero Claude
     dependency.
  ============================================================ */
  var STORE_PREFIX = 'tjstore::';
  function storeGetRaw(key){ try{ return localStorage.getItem(STORE_PREFIX+key); }catch(e){ return null; } }
  function storeKeysWithPrefix(prefix){
    var out=[];
    try{
      for(var i=0;i<localStorage.length;i++){
        var k=localStorage.key(i);
        if(k && k.indexOf(STORE_PREFIX+prefix)===0) out.push(k.slice(STORE_PREFIX.length));
      }
    }catch(e){}
    return out;
  }

  var MONTH_NAMES = ["January","February","March","April","May","June","July","August","September","October","November","December"];

  function readAllTrades(){
    var trades=[];
    storeKeysWithPrefix('trade:').forEach(function(k){
      var raw = storeGetRaw(k);
      if(!raw) return;
      try{
        var arr = JSON.parse(raw);
        var dateStr = k.slice('trade:'.length);
        arr.forEach(function(t){ t._date = dateStr; trades.push(t); });
      }catch(e){}
    });
    return trades;
  }

  function pnlOf(t){ return t.qtyType==='lots' ? (t.pnlDollar||0) : (t.pnlPercent||0); }
  function isLots(t){ return t.qtyType==='lots'; }
  function fmtMoney(v){ var s=v>0?'+':(v<0?'-':''); return s+'$'+Math.abs(v).toFixed(2).replace(/\.00$/,''); }
  function fmtPercent(v){ var s=v>0?'+':(v<0?'-':''); return s+Math.abs(v).toFixed(2)+'%'; }
  function fmtNum(v,d){ return (v==null||isNaN(v)) ? '—' : v.toFixed(d==null?1:d); }

  // Pick a single "primary" domain (dollars vs percent) so headline
  // stats read as one clean number instead of mixed units — the app
  // itself nudges people to stick to one quantity type consistently.
  function primaryDomain(trades){
    var lots=0, pct=0;
    trades.forEach(function(t){ if(isLots(t)) lots++; else pct++; });
    return lots>=pct ? 'lots' : 'percent';
  }
  function fmtDomain(v, domain){ return domain==='lots' ? fmtMoney(v) : fmtPercent(v); }

  function computeCoreStats(trades){
    var domain = primaryDomain(trades);
    var domainTrades = trades.filter(function(t){ return (domain==='lots')===isLots(t); });
    var count = domainTrades.length;
    var wins = domainTrades.filter(function(t){ return pnlOf(t)>0; });
    var losses = domainTrades.filter(function(t){ return pnlOf(t)<0; });
    var totalPnl = domainTrades.reduce(function(s,t){ return s+pnlOf(t); }, 0);
    var grossWin = wins.reduce(function(s,t){ return s+pnlOf(t); },0);
    var grossLoss = Math.abs(losses.reduce(function(s,t){ return s+pnlOf(t); },0));
    var winRate = count>0 ? (wins.length/count*100) : null;
    var avgWin = wins.length ? grossWin/wins.length : 0;
    var avgLoss = losses.length ? grossLoss/losses.length : 0;
    var avgRR = (avgLoss>0 && avgWin>0) ? (avgWin/avgLoss) : null;
    var expectancy = count>0 ? ((winRate/100)*avgWin - (1-winRate/100)*avgLoss) : null;
    var profitFactor = grossLoss>0 ? (grossWin/grossLoss) : (grossWin>0 ? Infinity : null);
    return {
      domain:domain, count: trades.length, domainCount:count, totalPnl:totalPnl, winRate:winRate,
      avgWin:avgWin, avgLoss:avgLoss, avgRR:avgRR, expectancy:expectancy, profitFactor:profitFactor,
      wins:wins.length, losses:losses.length
    };
  }

  function computeStreak(trades){
    var domain = primaryDomain(trades);
    var domainTrades = trades.filter(function(t){ return (domain==='lots')===isLots(t); });
    domainTrades.sort(function(a,b){
      var da=a._date+ (a.exitTime||''), db=b._date+(b.exitTime||'');
      return da<db?1:(da>db?-1:0);
    });
    if(!domainTrades.length) return {n:0,type:null};
    var first = pnlOf(domainTrades[0])>0 ? 'win' : (pnlOf(domainTrades[0])<0 ? 'loss' : null);
    if(!first) return {n:0,type:null};
    var n=0;
    for(var i=0;i<domainTrades.length;i++){
      var v=pnlOf(domainTrades[i]);
      var kind = v>0?'win':(v<0?'loss':null);
      if(kind===first) n++; else break;
    }
    return {n:n, type:first};
  }

  function computeDisciplineScore(trades){
    var withChecklist = trades.filter(function(t){ return t.checklist && t.checklist.length>0; });
    if(!withChecklist.length) return null;
    var total=0, checked=0;
    withChecklist.forEach(function(t){ t.checklist.forEach(function(c){ total++; if(c.checked) checked++; }); });
    return total>0 ? (checked/total*100) : null;
  }

  function groupBy(trades, keyFn){
    var map={};
    trades.forEach(function(t){
      var k=keyFn(t); if(k==null||k==='') return;
      if(!map[k]) map[k]=[];
      map[k].push(t);
    });
    return map;
  }

  function computeAll(){
    var trades = readAllTrades();
    var core = computeCoreStats(trades);
    var streak = computeStreak(trades);
    var discipline = computeDisciplineScore(trades);

    // Best / worst trading day
    var byDate = groupBy(trades, function(t){ return t._date; });
    var dayTotals = Object.keys(byDate).map(function(d){
      var dTrades = byDate[d];
      var dom = primaryDomain(dTrades);
      var sum = dTrades.filter(function(t){return (dom==='lots')===isLots(t);}).reduce(function(s,t){return s+pnlOf(t);},0);
      return {date:d, total:sum, domain:dom};
    });
    var bestDay = dayTotals.length ? dayTotals.reduce(function(a,b){ return b.total>a.total?b:a; }) : null;
    var worstDay = dayTotals.length ? dayTotals.reduce(function(a,b){ return b.total<a.total?b:a; }) : null;

    // Setups / playbook
    var bySetup = groupBy(trades, function(t){ return (t.setup||'').trim(); });
    var setupStats = Object.keys(bySetup).map(function(name){
      var s = computeCoreStats(bySetup[name]);
      return { name:name, count:bySetup[name].length, winRate:s.winRate, totalPnl:s.totalPnl, domain:s.domain };
    }).sort(function(a,b){ return b.totalPnl-a.totalPnl; });

    // Mistakes
    var byMistake = groupBy(trades, function(t){ var m=t.mistake||'None'; return m==='None'?null:m; });
    var mistakeStats = Object.keys(byMistake).map(function(m){ return {name:m, count:byMistake[m].length}; })
      .sort(function(a,b){ return b.count-a.count; });

    // Emotions
    var byEmotion = groupBy(trades, function(t){ return t.emotion||null; });
    var emotionStats = Object.keys(byEmotion).map(function(e){
      var s = computeCoreStats(byEmotion[e]);
      return { name:e, count:byEmotion[e].length, winRate:s.winRate };
    }).sort(function(a,b){ return b.count-a.count; });

    // Sessions
    var bySession = groupBy(trades, function(t){ return t.session||null; });
    var sessionStats = ['sydney','tokyo','london','newyork'].map(function(s){
      var list = bySession[s]||[];
      var st = computeCoreStats(list);
      return { name:s, count:list.length, winRate:st.winRate, totalPnl:st.totalPnl, domain:st.domain };
    }).filter(function(s){ return s.count>0; });

    // Long vs short
    var byDir = groupBy(trades, function(t){ return t.direction||null; });
    var dirStats = ['long','short'].map(function(d){
      var list = byDir[d]||[];
      var st = computeCoreStats(list);
      return { name:d, count:list.length, winRate:st.winRate, totalPnl:st.totalPnl, domain:st.domain };
    });

    // Avg hold time (minutes, same-day only)
    var holdMins = [];
    trades.forEach(function(t){
      if(!t.entryTime || !t.exitTime) return;
      var e = t.entryTime.split(':'), x = t.exitTime.split(':');
      var mins = (parseInt(x[0],10)*60+parseInt(x[1],10)) - (parseInt(e[0],10)*60+parseInt(e[1],10));
      if(mins>=0) holdMins.push(mins);
    });
    var avgHold = holdMins.length ? (holdMins.reduce(function(a,b){return a+b;},0)/holdMins.length) : null;

    // Monthly growth (last 6 months with data)
    var byMonth = groupBy(trades, function(t){ return t._date.slice(0,7); });
    var months = Object.keys(byMonth).sort();
    var monthStats = months.map(function(m){
      var list = byMonth[m];
      var st = computeCoreStats(list);
      return { month:m, totalPnl:st.totalPnl, domain:st.domain, count:list.length };
    }).slice(-6);

    // Journal quality: % of trades with a meaningful pre/post-trade write-up
    var withJournal = trades.filter(function(t){
      return (t.preTrade && t.preTrade.trim().length>15) || (t.postTrade && t.postTrade.trim().length>15);
    });
    var journalQuality = trades.length ? (withJournal.length/trades.length*100) : null;

    // Top symbols
    var bySymbol = groupBy(trades, function(t){ return t.symbol||null; });
    var symbolStats = Object.keys(bySymbol).map(function(sym){
      var s = computeCoreStats(bySymbol[sym]);
      return { name:sym, count:bySymbol[sym].length, winRate:s.winRate, totalPnl:s.totalPnl, domain:s.domain };
    }).sort(function(a,b){ return b.totalPnl-a.totalPnl; });

    // Day-of-week performance (Mon..Sun)
    var byWeekday = groupBy(trades, function(t){ return String(new Date(t._date+'T00:00:00').getDay()); });
    var WEEKDAY_ORDER = [1,2,3,4,5,6,0]; // Mon..Sun
    var weekdayStats = WEEKDAY_ORDER.map(function(dow){
      var list = byWeekday[String(dow)]||[];
      var st = computeCoreStats(list);
      return { dow:dow, count:list.length, totalPnl:st.totalPnl, domain:st.domain, winRate:st.winRate };
    });

    // Win/Loss distribution (gross profit / gross loss / net) in the primary domain
    var grossWin = core.avgWin * core.wins;
    var grossLoss = core.avgLoss * core.losses;

    // Day-level stats: winning/losing/breakeven days, streaks, largest day, avg daily P&L
    var dayList = dayTotals.slice().sort(function(a,b){ return a.date<b.date?-1:1; });
    var winningDays = dayList.filter(function(d){ return d.total>0; });
    var losingDays = dayList.filter(function(d){ return d.total<0; });
    var breakevenDays = dayList.filter(function(d){ return d.total===0; });
    var avgDailyPnl = dayList.length ? (dayList.reduce(function(s,d){return s+d.total;},0)/dayList.length) : null;
    var largestProfitableDay = winningDays.length ? winningDays.reduce(function(a,b){return b.total>a.total?b:a;}) : null;
    var largestLosingDay = losingDays.length ? losingDays.reduce(function(a,b){return b.total<a.total?b:a;}) : null;
    var avgWinningDayPnl = winningDays.length ? (winningDays.reduce(function(s,d){return s+d.total;},0)/winningDays.length) : null;
    var avgLosingDayPnl = losingDays.length ? (losingDays.reduce(function(s,d){return s+d.total;},0)/losingDays.length) : null;

    var maxConsecWinDays=0, maxConsecLossDays=0, curWin=0, curLoss=0;
    dayList.forEach(function(d){
      if(d.total>0){ curWin++; curLoss=0; } else if(d.total<0){ curLoss++; curWin=0; } else { curWin=0; curLoss=0; }
      maxConsecWinDays = Math.max(maxConsecWinDays, curWin);
      maxConsecLossDays = Math.max(maxConsecLossDays, curLoss);
    });

    // Max drawdown (from cumulative equity curve across ALL history, primary domain)
    var domain0 = core.domain;
    var domainTradesAll = trades.filter(function(t){ return (domain0==='lots')===isLots(t); })
      .slice().sort(function(a,b){ var da=a._date+(a.exitTime||''), db=b._date+(b.exitTime||''); return da<db?-1:1; });
    var cum=0, peak=0, maxDD=0, maxDDPct=0;
    domainTradesAll.forEach(function(t){
      cum += pnlOf(t);
      if(cum>peak) peak = cum;
      var dd = peak - cum;
      if(dd>maxDD) maxDD = dd;
      var ddPct = peak>0 ? (dd/peak*100) : 0;
      if(ddPct>maxDDPct) maxDDPct = ddPct;
    });

    // Avg hold time split by winners/losers
    var holdWin=[], holdLoss=[];
    trades.forEach(function(t){
      if(!t.entryTime || !t.exitTime) return;
      var e=t.entryTime.split(':'), x=t.exitTime.split(':');
      var mins=(parseInt(x[0],10)*60+parseInt(x[1],10))-(parseInt(e[0],10)*60+parseInt(e[1],10));
      if(mins<0) return;
      if(pnlOf(t)>0) holdWin.push(mins); else if(pnlOf(t)<0) holdLoss.push(mins);
    });
    var avgHoldWin = holdWin.length ? holdWin.reduce(function(a,b){return a+b;},0)/holdWin.length : null;
    var avgHoldLoss = holdLoss.length ? holdLoss.reduce(function(a,b){return a+b;},0)/holdLoss.length : null;

    return {
      trades:trades, core:core, streak:streak, discipline:discipline,
      bestDay:bestDay, worstDay:worstDay, setupStats:setupStats, mistakeStats:mistakeStats,
      emotionStats:emotionStats, sessionStats:sessionStats, dirStats:dirStats,
      avgHold:avgHold, avgHoldWin:avgHoldWin, avgHoldLoss:avgHoldLoss,
      monthStats:monthStats, journalQuality:journalQuality, symbolStats:symbolStats,
      weekdayStats:weekdayStats, grossWin:grossWin, grossLoss:grossLoss,
      totalTradingDays:dayList.length, winningDays:winningDays.length, losingDays:losingDays.length,
      breakevenDays:breakevenDays.length, maxConsecWinDays:maxConsecWinDays, maxConsecLossDays:maxConsecLossDays,
      avgDailyPnl:avgDailyPnl, largestProfitableDay:largestProfitableDay, largestLosingDay:largestLosingDay,
      avgWinningDayPnl:avgWinningDayPnl, avgLosingDayPnl:avgLosingDayPnl,
      maxDrawdown:maxDD, maxDrawdownPct:maxDDPct
    };
  }

  function fmtHold(mins){
    if(mins==null) return '—';
    if(mins<60) return Math.round(mins)+'m';
    return (mins/60).toFixed(1)+'h';
  }
  function sessionLabel(s){ return {sydney:'Sydney',tokyo:'Tokyo',london:'London',newyork:'New York'}[s]||s; }
  function dateLabel(d){ if(!d) return '—'; var p=d.split('-'); return MONTH_NAMES[parseInt(p[1],10)-1].slice(0,3)+' '+parseInt(p[2],10); }

  function hexToRgb(hex){
    hex = hex.replace('#','');
    if(hex.length===3) hex = hex.split('').map(function(c){return c+c;}).join('');
    var num = parseInt(hex,16);
    return [(num>>16)&255,(num>>8)&255,num&255];

  function mixHex(hex, pct, withHex){
    var a = hexToRgb(hex), b = hexToRgb(withHex), p = pct/100;

    return '#'+[r,g,bl].map(function(v){ return Math.max(0,Math.min(255,v)).toString(16).padStart(2,'0'); }).join('');
  }

  function computeEquitySeries(rangeKey){
    var trades = readAllTrades();
    var domain = primaryDomain(trades);
    var domainTrades = trades.filter(function(t){ return (domain==='lots')===isLots(t); });
    var cutoffDate = null;
    if(rangeKey!=='all'){
      cutoffDate = new Date(Date.now() - rangeKey*86400000);
    }
    var inRange = domainTrades.filter(function(t){
      if(!cutoffDate) return true;
      return new Date(t._date+'T00:00:00') >= cutoffDate;
    });
    inRange.sort(function(a,b){
      var da=a._date+(a.exitTime||''), db=b._date+(b.exitTime||'');
      return da<db?-1:(da>db?1:0);
    });
    var cum = 0;
    var series = inRange.map(function(t){ cum += pnlOf(t); return {date:t._date, value:cum}; });
    return { series:series, domain:domain, net:cum, count:inRange.length };
  }

  var currentEquityRange = 30;
  function renderEquityCurve(rangeKey){
    var data = computeEquitySeries(rangeKey);
    var wrap = document.getElementById('equityChartWrap');
    if(!data.series.length){
      wrap.innerHTML = '<div class="equity-empty">No trades in this period yet.</div>';
      return;
    }
    var values = data.series.map(function(p){ return p.value; });
    var min = Math.min(0, Math.min.apply(null, values));
    var max = Math.max(0, Math.max.apply(null, values));
    if(min===max){ min-=1; max+=1; }
    var W=320, H=120, PAD=6, n=values.length;
    function xAt(i){ return n<=1 ? W/2 : PAD + (i/(n-1))*(W-PAD*2); }
    function yAt(v){ return H-PAD - ((v-min)/(max-min))*(H-PAD*2); }
    var pts = values.map(function(v,i){ return xAt(i)+','+yAt(v); }).join(' L ');
    var linePath = 'M '+pts;
    var areaPath = linePath+' L '+xAt(n-1)+','+(H-PAD)+' L '+xAt(0)+','+(H-PAD)+' Z';
    var last = values[values.length-1];
    var positive = last>=0;
    function cssVar(name, fallback){
      try{ var v=getComputedStyle(document.body).getPropertyValue(name).trim(); return v||fallback; }catch(e){ return fallback; }
    }
    var strokeColor = cssVar(positive?'--green-text':'--red-text', positive?'#16A34A':'#DC2626');
    var gridColor = cssVar('--line', '#D7E6FB');
    var ringColor = cssVar('--card-bg', '#ffffff');
    var showZeroLine = min<0 && max>0;
    var gridLines = [0.25,0.5,0.75].map(function(f){
      var gy = H-PAD - f*(H-PAD*2);
      return '<line x1="0" y1="'+gy+'" x2="'+W+'" y2="'+gy+'" stroke="'+gridColor+'" stroke-width="1"/>';
    }).join('');
    var svg =
      '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:130px;overflow:visible;">'+
      '<defs><linearGradient id="eqfill" x1="0" y1="0" x2="0" y2="1">'+
        '<stop offset="0%" stop-color="'+strokeColor+'" stop-opacity="0.3"/>'+
        '<stop offset="100%" stop-color="'+strokeColor+'" stop-opacity="0"/>'+
      '</linearGradient></defs>'+
      gridLines+
      (showZeroLine ? '<line x1="0" y1="'+yAt(0)+'" x2="'+W+'" y2="'+yAt(0)+'" stroke="'+gridColor+'" stroke-width="1" stroke-dasharray="3,3"/>' : '')+
      '<path d="'+areaPath+'" fill="url(#eqfill)" stroke="none"/>'+
      '<path d="'+linePath+'" fill="none" stroke="'+strokeColor+'" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>'+
      '<circle cx="'+xAt(n-1)+'" cy="'+yAt(last)+'" r="4.2" fill="'+strokeColor+'" stroke="'+ringColor+'" stroke-width="2"/>'+
      '</svg>';
    wrap.innerHTML =
      '<div class="equity-summary"><span class="equity-summary-value" style="color:'+(positive?'var(--green-text)':'var(--red-text)')+'">'+fmtDomain(last, data.domain)+'</span>'+
      '<span class="equity-summary-label">'+data.count+' trade'+(data.count===1?'':'s')+' in this period</span></div>'+
      svg;
  }

  function renderHeatmap(trades){
    var now = new Date();
    var y=now.getFullYear(), m=now.getMonth();
    document.getElementById('heatmapMonthLabel').textContent = MONTH_NAMES[m]+' '+y;
    var dowRow = document.getElementById('heatmapDow');
    if(!dowRow.childElementCount){
      dowRow.innerHTML = ['M','T','W','T','F','S','S'].map(function(d){ return '<div class="heatmap-dow">'+d+'</div>'; }).join('');
    }
    var byDate = {};
    trades.forEach(function(t){
      var d=t._date;
      if(!d || parseInt(d.slice(0,4),10)!==y || (parseInt(d.slice(5,7),10)-1)!==m) return;
      if(!byDate[d]) byDate[d]=[];
      byDate[d].push(t);
    });
    var firstDay = new Date(y,m,1);
    var startOffset = (firstDay.getDay()+6)%7;
    var daysInMonth = new Date(y,m+1,0).getDate();
    var cells=[];
    for(var i=0;i<startOffset;i++) cells.push(null);
    for(var d=1; d<=daysInMonth; d++){
      var ds = y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
      var dayTrades = byDate[ds];
      var cls='empty';
      if(dayTrades){
        var dom = primaryDomain(dayTrades);
        var sum = dayTrades.filter(function(t){return (dom==='lots')===isLots(t);}).reduce(function(s,t){return s+pnlOf(t);},0);
        cls = sum>0?'win':(sum<0?'loss':'empty');
        if(sum===0) cls='';
      }
      cells.push(cls);
    }
    document.getElementById('heatmapGrid').innerHTML = cells.map(function(c, i){
      if(c===null) return '<div class="heatmap-cell" style="background:transparent;"></div>';
      var dayNum = i - startOffset + 1;
      return '<div class="heatmap-cell'+(c?(' '+c):'')+'"><span class="heatmap-daynum">'+dayNum+'</span></div>';
    }).join('');
  }

  function shiftDailyPnlMonth(delta){
    var m = dailyPnlView.month + delta, y = dailyPnlView.year;
    if(m<0){ m=11; y--; } if(m>11){ m=0; y++; }
    if(y<DPNL_MIN.year || (y===DPNL_MIN.year&&m<DPNL_MIN.month)) return;
    if(y>DPNL_MAX.year || (y===DPNL_MAX.year&&m>DPNL_MAX.month)) return;
    dailyPnlView = {year:y, month:m};
    renderAnalysis();
  }
  function computeDailyPnlForMonth(year, month){
    var trades = readAllTrades();
    var domain = primaryDomain(trades);
    var domainTrades = trades.filter(function(t){ return (domain==='lots')===isLots(t); });
    var daysInMonth = new Date(year, month+1, 0).getDate();
    var byDate = {};
    domainTrades.forEach(function(t){ (byDate[t._date] = byDate[t._date]||[]).push(t); });
    var days = [];
    for(var d=1; d<=daysInMonth; d++){
      var ds = year+'-'+String(month+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
      var list = byDate[ds]||[];
      var total = list.reduce(function(s,t){ return s+pnlOf(t); }, 0);
      days.push({day:d, total:total, count:list.length});
    }
    return {days:days, domain:domain};
  }

  function renderAvgWinLossSemi(a){

    if(!aw && !al) return '<div class="section-label">Avg Win vs Avg Loss</div><div class="insight-card"><div class="insight-label">Log trades to see this.</div></div>';
    var cx=50, cy=50, r=44;
    var winShare = (aw+al) ? (aw/(aw+al)) : 0.5;
    winShare = Math.max(0.04, Math.min(0.96, winShare)); // keep both arcs visibly present even at extreme ratios
    var angleRad = (180*(1-winShare)) * Math.PI/180;
    var midX = (cx + r*Math.cos(angleRad)).toFixed(2);
    var midY = (cy - r*Math.sin(angleRad)).toFixed(2);
    var greenPath = 'M '+(cx-r)+' '+cy+' A '+r+' '+r+' 0 0 1 '+midX+' '+midY;
    var redPath = 'M '+midX+' '+midY+' A '+r+' '+r+' 0 0 1 '+(cx+r)+' '+cy;
    return '<div class="section-label">Avg Win vs Avg Loss</div><div class="insight-card">'+
      '<div class="awl-wrap">'+
        '<svg viewBox="0 0 100 56" class="awl-svg">'+
          '<path d="'+greenPath+'" fill="none" stroke="var(--green-400)" stroke-width="11" stroke-linecap="round"/>'+
          '<path d="'+redPath+'" fill="none" stroke="var(--red-400)" stroke-width="11" stroke-linecap="round"/>'+
          '<text x="50" y="54" text-anchor="middle" class="awl-ratio-txt">'+Math.round(winShare*100)+'% / '+Math.round((1-winShare)*100)+'%</text>'+
        '</svg>'+
        '<div class="awl-values">'+
          '<div class="awl-val awl-val--win"><span>Avg Win</span><b>'+fmtDomain(aw,a.core.domain)+'</b></div>'+
          '<div class="awl-val awl-val--loss"><span>Avg Loss</span><b>'+fmtDomain(-al,a.core.domain)+'</b></div>'+
        '</div>'+
      '</div></div>';
  }

  function gatherBackupData(){
    var data = {};
    try{
      for(var i=0;i<localStorage.length;i++){
        var k = localStorage.key(i);
        if(k && k.indexOf(STORE_PREFIX)===0) data[k.slice(STORE_PREFIX.length)] = localStorage.getItem(k);
      }
    }catch(e){}
    return data;
  }
  function downloadBackup(){
    var data = gatherBackupData();
    var blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = 'trading-journal-backup-'+new Date().toISOString().slice(0,10)+'.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
  }

  /* Border-trace: a bright line sweeps once around the newly active nav pill. */
  function playNavTrace(name){
    var activeBtn = document.querySelector('.nav-item[data-nav="'+name+'"]');
    var nav = document.getElementById('bottomNav');
    var rect = document.getElementById('navTraceRect');
    var svg = document.getElementById('navTraceSvg');
    if(!activeBtn || !nav || !rect || !svg) return;
    var w = activeBtn.offsetWidth, h = activeBtn.offsetHeight;
    var left = activeBtn.offsetLeft, top = activeBtn.offsetTop;
    if(!w || !h) return;
    var r = h/2;
    svg.setAttribute('viewBox','0 0 '+w+' '+h);
    svg.style.left = left+'px'; svg.style.top = top+'px';
    svg.style.width = w+'px'; svg.style.height = h+'px';
    rect.setAttribute('width', w); rect.setAttribute('height', h);
    rect.setAttribute('rx', r); rect.setAttribute('ry', r);
    var peri = 2*(w-h) + Math.PI*h;
    rect.style.setProperty('--peri', peri);
    rect.setAttribute('stroke-dasharray', peri);
    rect.style.animation = 'none';
    void rect.getBoundingClientRect();
    rect.style.animation = 'navTraceDraw .9s ease forwards';
  }

  function loadFrameOnce(frameId, toolKey, onLoad){
    var frame = document.getElementById(frameId);
    if(frame.getAttribute('data-loaded')===toolKey){ if(onLoad) onLoad(frame); return; }
    var html = decodedSrc(toolKey);
    if(html==null) return;
    frame.srcdoc = html;
    frame.setAttribute('data-loaded', toolKey);
    if(onLoad) frame.addEventListener('load', function handler(){ frame.removeEventListener('load', handler); onLoad(frame); });
  }

  var toolView = document.getElementById('toolView');
  var toolFrame = document.getElementById('toolFrame');
  function openTool(key){
    var meta = TOOL_META[key];
    var html = decodedSrc(key);
    toolFrame.srcdoc = html || '<p style="font-family:sans-serif;padding:20px;">Tool not found.</p>';
    toolView.classList.add('open');
  }
  function closeTool(){
    toolView.classList.remove('open');
    setTimeout(function(){ toolFrame.srcdoc = 'about:blank'; }, 300);
    applyAppearance();
  }
  document.getElementById('toolBackBtn').addEventListener('click', closeTool);
  function refreshAvatarBtn(){
    var initialSrc = (currentUser && ((currentUser.user_metadata && currentUser.user_metadata.full_name) || currentUser.email)) || 'T';
    document.getElementById('avatarBtn').textContent = initialSrc.trim().charAt(0).toUpperCase();
  }
  refreshAvatarBtn();

  /* ============================================================
     PROFILE (account: email, display name, sign out)
  ============================================================ */
  var profileView = document.getElementById('profileView');
  function openProfile(){
    if(!authClient || !currentUser){ openTool('settings'); return; } // no account without Supabase configured
    renderProfile();
    profileView.classList.add('open');
  }
  function closeProfile(){ profileView.classList.remove('open'); }
  document.getElementById('avatarBtn').addEventListener('click', openProfile);
  document.getElementById('profileBackBtn').addEventListener('click', closeProfile);

  function setProfileMsg(text, kind){
    var el = document.getElementById('profileMsg');
    el.textContent = text || '';
    el.className = 'profile-msg' + (kind ? ' is-'+kind : '');
  }

  function renderProfile(){
    var name = (currentUser.user_metadata && currentUser.user_metadata.full_name) || '';
    var initial = (name || currentUser.email || 'T').trim().charAt(0).toUpperCase();
    document.getElementById('profileAvatarLg').textContent = initial;
    document.getElementById('profileNameDisplay').textContent = name || 'Trader';
    document.getElementById('profileEmailDisplay').textContent = currentUser.email || '';
    document.getElementById('profileNameInput').value = name;
    setProfileMsg('');

    var items = [
      {icon:ICONS.mail, grad:GRAD.gold, title:'Reset password', sub:'Email yourself a reset link', action:function(){
        authClient.auth.resetPasswordForEmail(currentUser.email).then(function(result){
          setProfileMsg(result.error ? (result.error.message || 'Could not send reset email.') : 'Reset email sent — check your inbox.', result.error ? 'err' : 'ok');
        });
      }},
      {icon:ICONS.signout, grad:GRAD.red, title:'Sign out', sub:currentUser.email || 'End your session', action:function(){ closeProfile(); signOut(); }}
    ];
    document.getElementById('profileAccountList').innerHTML = items.map(function(it,i){
      return '<button class="more-item" type="button" data-i="'+i+'">'+
        '<div class="more-icon" style="background:'+it.grad+'">'+it.icon+'</div>'+
        '<div class="more-text"><div class="more-item-title">'+it.title+'</div><div class="more-item-sub">'+it.sub+'</div></div>'+
        '<span class="more-chevron">'+ICONS.chevron+'</span></button>';
    }).join('');
    document.querySelectorAll('#profileAccountList [data-i]').forEach(function(btn){
      btn.addEventListener('click', function(){ items[parseInt(btn.dataset.i,10)].action(); });
    });
  }

  document.getElementById('profileSaveBtn').addEventListener('click', function(){
    var btn = this;
    var newName = document.getElementById('profileNameInput').value.trim();
    btn.disabled = true;
    setProfileMsg('Saving…');
    authClient.auth.updateUser({ data: { full_name: newName } }).then(function(result){
      btn.disabled = false;
      if(result.error){ setProfileMsg(result.error.message || 'Could not save name.', 'err'); return; }
      currentUser = result.data.user;
      document.getElementById('profileNameDisplay').textContent = newName || 'Trader';
      document.getElementById('profileAvatarLg').textContent = (newName || currentUser.email || 'T').trim().charAt(0).toUpperCase();
      refreshAvatarBtn();
      setProfileMsg('Saved.', 'ok');
    });
  });

  // Settings.html asks the parent to close the tool overlay once the user
  // backs all the way out of it (it has no home screen of its own anymore).
  window.addEventListener('message', function(ev){
    if(ev.data && ev.data.type==='tj-tool-close') closeTool();
  });

  /* ============================================================
     NOTIFICATION PANEL
  ============================================================ */
  var notifPanel = document.getElementById('notifPanel');
  function closeNotifPanel(){ notifPanel.classList.remove('open'); }
  document.getElementById('notifBtn').addEventListener('click', function(e){
    e.stopPropagation();
    notifPanel.classList.toggle('open');
  });
  document.addEventListener('click', function(e){
    if(notifPanel.classList.contains('open') && !notifPanel.contains(e.target) && e.target.id!=='notifBtn'){
      closeNotifPanel();
    }
  });

  /* ============================================================
     INIT
  ============================================================ */
  applyAppearance();
  goToView('home');
  } // end startApp()

  if(!authReady){
    // No Supabase project configured yet — run without the auth gate so the
    // app keeps working standalone. See the setup guide to turn this on.
    enterApp(null);
  } else {
    authClient.auth.getSession().then(function(result){
      var session = result.data && result.data.session;
      if(!session){ showAuth('login'); return; }
      enterApp(session);
    });
    authClient.auth.onAuthStateChange(function(event, session){
      if(event==='SIGNED_OUT'){ appStarted = false; resetLoadedToolFrames(); clearSyncedLocalKeys(); showAuth('login'); }
    });
  }
})();
</script>
</body>
</html>
